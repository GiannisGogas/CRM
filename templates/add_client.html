<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Προσθήκη Νέου Πελάτη - CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">CRM App</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('clients') }}">Πίσω στους Πελάτες</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Καρτέλα Νέου Πελάτη</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">Όνομα / Επωνυμία Πελάτη *</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Τηλέφωνο</label>
                                    <input type="text" name="phone" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Διεύθυνση</label>
                                <input type="text" name="address" class="form-control">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">ΑΦΜ</label>
                                    <input type="text" name="afm" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">ΚΑΔ</label>
                                    <input type="text" name="kad" class="form-control">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Πλήθος Εργαζομένων</label>
                                    <input type="text" name="employees_count" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Κατηγορίες Εργαζομένων</label>
                                    <input type="text" name="employee_categories" class="form-control">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Ωράριο Λειτουργίας</label>
                                <input type="text" name="working_hours" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Κωδικοί Taxis - Sepnet</label>
                                <input type="text" name="taxis_sepnet_codes" class="form-control">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Νόμιμος Εκπρόσωπος</label>
                                    <input type="text" name="legal_representative" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Λογιστικό Γραφείο</label>
                                    <input type="text" name="accounting_office" class="form-control">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 mt-3">Αποθήκευση Πελάτη</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
